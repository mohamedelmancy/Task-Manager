<div class="filters">
  <div class="statuses" role="group" [attr.aria-label]="i18n.t('filters.status')">
    @for (option of statusOptions; track option.value) {
      <button
        type="button"
        class="status-button"
        [class.is-active]="filters().status === option.value"
        [attr.aria-pressed]="filters().status === option.value"
        (click)="chooseStatus(option.value)"
      >
        {{ i18n.t(option.labelKey) }}
      </button>
    }
  </div>
  <div class="filter-actions">
    <div class="dropdown">
      <button
        type="button"
        class="dropdown-button"
        [attr.aria-expanded]="priorityOpen()"
        aria-haspopup="listbox"
        [attr.aria-controls]="priorityOpen() ? 'priority-options' : null"
        [attr.aria-label]="filterName('filters.priority', priorityLabel())"
        (click)="togglePriority()"
      >
        {{ priorityLabel() }}
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path
            d="M2.5 4.5 6 8l3.5-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      @if (priorityOpen()) {
        <ul
          id="priority-options"
          class="dropdown-menu"
          role="listbox"
          [attr.aria-label]="i18n.t('filters.priority')"
        >
          @for (option of priorityOptions; track option.value) {
            <li role="presentation">
              <button
                type="button"
                class="dropdown-option"
                role="option"
                [attr.aria-selected]="filters().priority === option.value"
                (click)="choosePriority(option.value)"
              >
                {{ i18n.t(option.labelKey) }}
              </button>
            </li>
          }
        </ul>
      }
    </div>
    <div class="dropdown">
      <button
        type="button"
        class="dropdown-button"
        [attr.aria-expanded]="assigneeOpen()"
        aria-haspopup="listbox"
        [attr.aria-controls]="assigneeOpen() ? 'assignee-options' : null"
        [attr.aria-label]="filterName('filters.assignee', assigneeLabel())"
        (click)="toggleAssignee()"
      >
        {{ assigneeLabel() }}
        <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path
            d="M2.5 4.5 6 8l3.5-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      @if (assigneeOpen()) {
        <ul
          id="assignee-options"
          class="dropdown-menu"
          role="listbox"
          [attr.aria-label]="i18n.t('filters.assignee')"
        >
          <li role="presentation">
            <button
              type="button"
              class="dropdown-option"
              role="option"
              [attr.aria-selected]="filters().assigneeId === 'all'"
              (click)="chooseAssignee('all')"
            >
              {{ i18n.t('filters.all') }}
            </button>
          </li>
          @for (person of assignees(); track person.id) {
            <li role="presentation">
              <button
                type="button"
                class="dropdown-option"
                role="option"
                [attr.aria-selected]="filters().assigneeId === person.id"
                (click)="chooseAssignee(person.id)"
              >
                {{ person.name }}
              </button>
            </li>
          }
        </ul>
      }
    </div>
    <button type="button" class="new-task" (click)="createTask()">
      {{ i18n.t('nav.newTask') }}
    </button>
  </div>
</div>

@if (saveError()) {
  <p class="save-error" role="alert">{{ saveError() }}</p>
}

<app-task-board
  [status]="filters().status"
  [priority]="filters().priority"
  [assigneeId]="filters().assigneeId"
  [query]="taskSearch.query()"
/>
